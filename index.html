<script>
(()=>{
const T2=Math.PI*2,cv=document.getElementById('c'),g=cv.getContext('2d',{alpha:false});
/* ---------- tiện ích ---------- */
let sd=20260607;const R=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const nz=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]};
const cr=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
/* ---------- camera ---------- */
let W,H,U,U0,ZM=1,bqZ=1,Q=0,OX,OY,dpr=1,bx,by,bw,bh,curT=0,YAW=0,YV=0,PIT=0,omega=.42,drag=false,dxs=0;
const PI_=.38,sp=Math.sin(PI_),cp=Math.cos(PI_),D=14,tmp=[0,0,0,0],tp=[0,0,0];
const PR=(x,y,z,o)=>{const yv=y*cp-z*sp,zv=y*sp+z*cp,k=D/(D-zv);o[0]=OX+x*k*U;o[1]=OY-yv*k*U;o[2]=zv;o[3]=k};
let vyc=1,vys=0,vpc=1,vps=0;const setView=()=>{vyc=Math.cos(YAW);vys=Math.sin(YAW);vpc=Math.cos(PIT);vps=Math.sin(PIT)};
const P=(x,y,z,o)=>{const x1=x*vyc+z*vys,z0=-x*vys+z*vyc;PR(x1,y*vpc-z0*vps,y*vps+z0*vpc,o)};

/* ---------- bảng màu đỏ ---------- */
const RAMP=[[0,40,5,5],[.3,140,10,15],[.55,210,20,30],[.78,250,50,60],[1,255,180,180]];
const LUT=[...Array(128)].map((_,n)=>{const i=n/127;let k=0;while(k<3&&i>RAMP[k+1][0])k++;const A=RAMP[k],B=RAMP[k+1],f=(i-A[0])/(B[0]-A[0]);return`rgb(${A[1]+(B[1]-A[1])*f|0},${A[2]+(B[2]-A[2])*f|0},${A[3]+(B[3]-A[3])*f|0})`});
const mk=(c,disc)=>{const x=document.createElement('canvas');x.width=x.height=64;const y=x.getContext('2d'),r=y.createRadialGradient(32,32,0,32,32,32);
  if(disc){r.addColorStop(0,`rgba(${c},.5)`);r.addColorStop(.78,`rgba(${c},.65)`);r.addColorStop(1,`rgba(${c},0)`)}
  else{r.addColorStop(0,`rgba(${c},.9)`);r.addColorStop(1,`rgba(${c},0)`)}y.fillStyle=r;y.fillRect(0,0,64,64);return x};
const SPB=['255,30,30','220,10,30','255,80,80'].map(c=>mk(c,1)),SPG=mk('255,20,20',0);
const hp=y=>{y.beginPath();y.moveTo(0,.9);y.bezierCurveTo(-1.1,.2,-1,-.8,-.5,-.8);y.bezierCurveTo(-.2,-.8,0,-.6,0,-.35);y.bezierCurveTo(0,-.6,.2,-.8,.5,-.8);y.bezierCurveTo(1,-.8,1.1,.2,0,.9);y.closePath()};
const hs=(c1,c2)=>{const x=document.createElement('canvas');x.width=x.height=64;const y=x.getContext('2d');
  y.translate(32,33);y.scale(19,19);y.shadowColor=c1;y.shadowBlur=12;
  const gr=y.createLinearGradient(0,-.8,0,.9);gr.addColorStop(0,c2);gr.addColorStop(1,c1);y.fillStyle=gr;hp(y);y.fill();
  y.shadowBlur=0;y.fillStyle='rgba(255,255,255,.55)';y.beginPath();y.ellipse(-.5,-.45,.17,.1,-.6,0,T2);y.fill();return x};
const HS=[hs('#e60018','#ff6070'),hs('#ff1030','#ff8090'),hs('#c00010','#ff4050')];

/* ---------- bó hồng ---------- */
const qs_=[],stems=[];
const heads=[[.3,1.05,-.1,.56],[-.42,.78,.15,.52],[.62,.52,.25,.5],[-.88,.28,.1,.46],[.22,.12,.45,.54],[-.25,.42,-.35,.42]];
const LY=[[3,.045,.2,.1,0,.02],[4,.1,.27,.28,.1,0],[5,.18,.32,.52,.2,-.03],[6,.27,.36,.8,.35,-.06],[7,.36,.38,1.12,.6,-.1]];
heads.forEach(([hx0,hy0,hz,sz0],hi)=>{const hx=hx0*.92,hy=hy0*1.02+.08,sz=sz0*1.42;
  const c=[hx,hy,hz],ax=nz([hx-.05,hy+1.4,hz]),bx_=nz(cr([0,0,1],ax)),by_=cr(ax,bx_);
  const loc=(x,y,z)=>[0,1,2].map(i=>c[i]+sz*(bx_[i]*x+by_[i]*y+ax[i]*z));
  LY.forEach(([n,r,L,tl,cu,z],k)=>{for(let p=0;p<n;p++){
    const th0=T2*p/n+k*.7+rg(-.2,.2),hw=Math.PI/n*1.55,t=(tl+rg(-.08,.08))*.82,l=L*1.15*rg(.9,1.1),gr=[];
    for(let j=0;j<=3;j++){const v=j/3,row=[];for(let i=-1;i<=1;i++){
      const th=th0+i*hw*(.5+.5*v),rad=r+l*(Math.sin(t)*v+cu*.35*v*v)+.05*l*i*i*v,
            h=z+l*(Math.cos(t)*v-cu*.25*v*v)+.04*l*Math.sin(i*2.4+th0*3)*v*v;
      row.push(loc(rad*Math.cos(th),rad*Math.sin(th),h))}gr.push(row)}
    for(let j=0;j<3;j++)for(let i=0;i<2;i++)qs_.push({v:[gr[j][i],gr[j][i+1],gr[j+1][i+1],gr[j+1][i]],tone:rg(-.07,.07),o:k/4,e:j==2})
  }});
  const e=[rg(-.22,.22),-1.5-rg(0,.3),rg(-.1,.1)],b=loc(0,0,-.2),pts=[];
  for(let i=0;i<=12;i++){const u=i/12;pts.push([b[0]+(e[0]-b[0])*u+Math.sin(u*Math.PI)*.12*(hi%2?1:-1),b[1]+(e[1]-b[1])*u,b[2]+(e[2]-b[2])*u])}

for(let i=0;i<6;i++){

  for(let j=0;j<=3;j++){const v=j/3,hw=.11*Math.sin(Math.PI*Math.pow(v,.8));

}
const NQ=qs_.length,QV=new Float32Array(NQ*12),QN=new Float32Array(NQ*3),QT=new Float32Array(NQ),QO=new Float32Array(NQ),QE=new Uint8Array(NQ);
qs_.forEach((q,i)=>{q.v.forEach((p,k)=>{QV[i*12+k*3]=p[0];QV[i*12+k*3+1]=p[1];QV[i*12+k*3+2]=p[2]});
  const a=q.v,n=nz(cr([a[2][0]-a[0][0],a[2][1]-a[0][1],a[2][2]-a[0][2]],[a[3][0]-a[1][0],a[3][1]-a[1][1],a[3][2]-a[1][2]]));
  QN.set(n,i*3);QT[i]=q.tone;QO[i]=q.o;QE[i]=q.e?1:0});
qs_.length=0;
const SX=new Float32Array(NQ*8),ZZ=new Float32Array(NQ),CI=new Uint8Array(NQ),ORD=new Uint16Array(NQ);
for(let i=0;i<NQ;i++)ORD[i]=i;
const L1=nz([-.45,.6,.65]),L2=nz([.7,.2,.4]),Hh=nz([-.45,.6,1.65]);
const bc=document.createElement('canvas');let bq=bc.getContext('2d'),bqT=-1;

function bouquet(c,t,bk,sortNow){
  c.setTransform(dpr,0,0,dpr,-bx*dpr,-by*dpr);c.clearRect(bx,by,bw,bh);
  const yaw=.42*t,roll=-.2+.08*Math.sin(.5*t),sc=.88+.12*bk,cy=Math.cos(yaw),sy=Math.sin(yaw),cz=Math.cos(roll),sz=Math.sin(roll);
  const tx=(x,y,z,o)=>{const x1=x*cy+z*sy,z1=-x*sy+z*cy;o[0]=(x1*cz-y*sz)*sc;o[1]=(x1*sz+y*cz)*sc;o[2]=z1*sc};
  c.globalCompositeOperation='lighter';
  c.globalAlpha=(.16+.25*Math.exp(-(((t-2.1)/.3)**2)))*bk;
  P(0,.35,0,tmp);const gs=U*4;c.drawImage(SPG,tmp[0]-gs/2,tmp[1]-gs/2,gs,gs);
  c.globalAlpha=bk;c.lineCap='round';c.lineJoin='round';
  for(const s of stems){c.beginPath();for(let i=0;i<s.length;i++){tx(s[i][0],s[i][1],s[i][2],tp);P(tp[0],tp[1],tp[2],tmp);i?c.lineTo(tmp[0],tmp[1]):c.moveTo(tmp[0],tmp[1])}
    c.lineWidth=5*U/100;c.strokeStyle='rgba(255,50,50,.2)';c.stroke();c.lineWidth=1.5*U/100;c.strokeStyle='rgba(255,200,200,.9)';c.stroke()}
  c.globalCompositeOperation='source-over';
  const inv=1/sc;
  for(let q=0;q<NQ;q++){let zs=0;const b=q*12;
    for(let v=0;v<4;v++){tx(QV[b+v*3],QV[b+v*3+1],QV[b+v*3+2],tp);P(tp[0],tp[1],tp[2],tmp);SX[q*8+v*2]=tmp[0];SX[q*8+v*2+1]=tmp[1];zs+=tmp[2]}
    ZZ[q]=zs;
    tx(QN[q*3],QN[q*3+1],QN[q*3+2],tp);const nw0=tp[0]*inv,nw1=tp[1]*inv,nw2=tp[2]*inv;
    let n0=nw0,n1=nw1*cp-nw2*sp,n2=nw1*sp+nw2*cp;if(n2<0){n0=-n0;n1=-n1;n2=-n2}
    const d1=Math.max(0,n0*L1[0]+n1*L1[1]+n2*L1[2]),d2=Math.max(0,n0*L2[0]+n1*L2[1]+n2*L2[2]),dh=Math.max(0,n0*Hh[0]+n1*Hh[1]+n2*Hh[2]),o=QO[q];
    let I;if(o>1)I=.55+.3*d1+QT[q];else{I=.13+.46*d1+.2*d2+.95*dh**28+.26*(1-n2)**2+QT[q];I*=.72+.42*o}
    CI[q]=Math.round(cl(I)*127)}
  if(sortNow)ORD.sort((a,b)=>ZZ[a]-ZZ[b]);
  for(let k=0;k<NQ;k++){const q=ORD[k],o=q*8,pale=QO[q]>1;
    c.beginPath();c.moveTo(SX[o],SX[o+1]);c.lineTo(SX[o+2],SX[o+3]);c.lineTo(SX[o+4],SX[o+5]);c.lineTo(SX[o+6],SX[o+7]);c.closePath();
    c.globalAlpha=bk*(pale?.6:.94);c.fillStyle=LUT[CI[q]];c.fill();
    if(QE[q]){c.lineWidth=.6;c.strokeStyle='rgba(255,180,180,.7)';c.stroke()}}
  c.globalAlpha=1}

/* ---------- quỹ đạo, vòng sáng, bokeh ---------- */
const rings=[
  {c:[.08,-.7,0],R:1.75,t:u=>-.26+.26*Math.cos(.55*(u-2)),r:u=>.62*(.5-.5*Math.cos(.55*(u-2))),w:1.1},
  {c:[0,-.55,0],R:.85,t:u=>.1*Math.sin(.8*u),r:u=>-.12+.12*Math.sin(.5*u+1),w:-1.6}];
const RN=80,TN=18;rings.forEach(o=>{o.P=new Float32Array((RN+1)*3);o.T=new Float32Array(TN*5)});
const SK=[...Array(56)].map((_,i)=>({r:rg(.9,2.5),yc:cl(rg(-1,1.1)+.1,-1.2,1.2),roll:rg(.12,.3),tilt:-PI_+rg(-.1,.1),ph:rg(0,T2),v:rg(1.4,3.1),L:rg(.9,2.6),t0:i<20?-3:rg(0,1.6),ty:i%5==0?1:0}));
const HT=[...Array(30)].map((_,i)=>({r:rg(.8,2.5),yc:rg(-1.1,1.3),roll:rg(.1,.3),tilt:-PI_+rg(-.16,.16),ph:rg(0,T2),v:rg(.9,2),s:rg(5,13),t0:i<8?-3:rg(.1,1.9),ci:i%3}));
[...SK,...HT].forEach(o=>{o.st=Math.sin(o.tilt);o.ct=Math.cos(o.tilt);o.sr=Math.sin(o.roll);o.cr=Math.cos(o.roll)});
const BK=[...Array(22)].map(()=>({x:rg(-3.1,3.3),y:rg(-1.5,1.5),r:rg(.05,.15),a:rg(.06,.16),w:rg(.2,.6),ph:rg(0,T2),k:(R()*3)|0,t0:rg(0,1)}));
const orbP=(o,ph,rad,out)=>{const x=rad*Math.cos(ph),z=rad*Math.sin(ph),y1=-z*o.st,z1=z*o.ct;P(x*o.cr-y1*o.sr+.3,x*o.sr+y1*o.cr+o.yc,z1,out)};
const SN=9,SB=SK.map(()=>({p:new Float32Array((SN+1)*2),f:true,a:0}));

function streakUpd(t){
  for(let i=0;i<SK.length;i++){const s=SK[i],b=SB[i],a=sm((t-s.t0)/.5);b.a=a;if(!a)continue;
    const L=s.L*sm((t-s.t0)/1.1),h=s.ph+s.v/s.r*t;
    for(let k=0;k<=SN;k++){orbP(s,h-L/s.r*k/SN,s.r,tmp);b.p[k*2]=tmp[0];b.p[k*2+1]=tmp[1];if(!k)b.f=tmp[2]>.05}}}
function streaks(front){
  g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
  for(let i=0;i<SK.length;i++){const b=SB[i];if(!b.a||b.f!==front||(Q>0&&i&1))continue;
    const s=SK[i],A=b.a*(front?1:.65),p=b.p,big=s.ty==1;
    g.beginPath();g.moveTo(p[0],p[1]);for(let k=1;k<=SN;k++)g.lineTo(p[k*2],p[k*2+1]);
    g.lineWidth=(big?6:4)*U/100;g.strokeStyle=`rgba(255,40,40,${.13*A})`;g.stroke();
    g.beginPath();g.moveTo(p[0],p[1]);for(let k=1;k<=3;k++)g.lineTo(p[k*2],p[k*2+1]);
    g.lineWidth=(big?2.2:1.5)*U/100;g.strokeStyle=big?`rgba(255,150,150,${.9*A})`:`rgba(255,255,255,${.95*A})`;g.stroke()}}
function hearts(t,front){
  g.globalCompositeOperation='lighter';
  for(const h of HT){const a=sm((t-h.t0)/.4);if(!a)continue;orbP(h,h.ph+h.v/h.r*t,h.r,tmp);if((tmp[2]>.05)!==front)continue;
    const sz=h.s*U/100*tmp[3]*(1+.1*Math.sin(5*t+h.ph))*.85;g.globalAlpha=a*(front?1:.7);g.drawImage(HS[h.ci],tmp[0]-sz,tmp[1]-sz,sz*2,sz*2)}
  g.globalAlpha=1}
function ringPrep(o,t,sc){
  const tt=o.t(t),rr=o.r(t),ct=Math.cos(tt),st=Math.sin(tt),c2=Math.cos(rr),s2=Math.sin(rr),R0=o.R*sc;
  const tf=(x,y,z,out)=>{const y1=y*ct-z*st,z1=y*st+z*ct;P(x*c2-y1*s2+o.c[0],x*s2+y1*c2+o.c[1],z1+o.c[2],out)};
  for(let i=0;i<=RN;i++){const a=T2*i/RN;tf(R0*Math.cos(a),0,R0*Math.sin(a),tmp);o.P[i*3]=tmp[0];o.P[i*3+1]=tmp[1];o.P[i*3+2]=tmp[2]}
  for(let j=0;j<TN;j++){const a=T2*j/TN+o.w*t*.3,u=j%2?.05:-.05,ca=Math.cos(a),sa=Math.sin(a);
    tf(R0*ca,0,R0*sa,tmp);o.T[j*5]=tmp[0];o.T[j*5+1]=tmp[1];o.T[j*5+2]=tmp[2];
    tf((R0+.07)*ca,u,(R0+.07)*sa,tmp);o.T[j*5+3]=tmp[0];o.T[j*5+4]=tmp[1]}
  P(o.c[0],o.c[1],o.c[2],tmp);o.zc=tmp[2]}

  const p=o.P,zc=o.zc;g.globalCompositeOperation='lighter';g.lineCap='round';
  g.beginPath();for(let i=0;i<RN;i++)if(((p[i*3+2]+p[i*3+5])/2>zc)===front){g.moveTo(p[i*3],p[i*3+1]);g.lineTo(p[i*3+3],p[i*3+4])}
  for(const[w,c]of[[9,`rgba(255,60,60,${.12*al})`],[2.6,`rgba(255,150,150,${.7*al})`],[1.2,`rgba(255,255,255,${al})`]]){g.lineWidth=w*U/100;g.strokeStyle=c;g.stroke()}
  g.beginPath();for(let j=0;j<TN;j++){if((o.T[j*5+2]>zc)===front){g.moveTo(o.T[j*5],o.T[j*5+1]);g.lineTo(o.T[j*5+3],o.T[j*5+4])}}

  for(const b of BK){const a=b.a*(.7+.3*Math.sin(t*1.5+b.ph))*sm((t-b.t0)/.5);PR(b.x+.25*Math.cos(b.w*t+b.ph),b.y+.2*Math.sin(b.w*t*1.3+b.ph),0,tmp);const r=b.r*U;
    g.globalAlpha=a*1.4;g.drawImage(SPB[b.k],tmp[0]-r,tmp[1]-r,r*2,r*2)}g.globalAlpha=1}

{const y=bgc.getContext('2d'),r=y.createRadialGradient(128,112,10,128,128,190);r.addColorStop(0,'#2e0a0c');r.addColorStop(.5,'#170606');r.addColorStop(1,'#070202');y.fillStyle=r;y.fillRect(0,0,256,256)}

});
document.getElementById('btnSkip').addEventListener('click', () => {
    document.getElementById('pwdModal').style.display = 'none';
});
document.getElementById('pwdInput').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') document.getElementById('btnSubmit').click();
});

function buildText(){
  const U=U0,tr=Math.min(3,dpr*1.5);
  tw=Math.ceil(7.6*U);th=Math.ceil(2.1*U);tc.width=tw*tr|0;tc.height=th*tr|0;
  const x=tc.getContext('2d');x.setTransform(tr,0,0,tr,0,0);x.textAlign='center';x.textBaseline='middle';
  const f="'Segoe UI',Tahoma,'Helvetica Neue',sans-serif",l1=.55*U,l2=1.25*U;
  const g1=x.createLinearGradient(0,l1-.3*U,0,l1+.3*U);g1.addColorStop(0,'#ffd0d0');g1.addColorStop(1,'#ff8a96');
  const g2=x.createLinearGradient(0,l2-.5*U,0,l2+.5*U);g2.addColorStop(0,'#ffffff');g2.addColorStop(1,'#ffc4cc');
  x.shadowColor='rgba(255,30,40,.95)';x.shadowBlur=.22*U;
  
  for(let i=0;i<2;i++){
    if(!isUnlocked) {
      // Khi chưa mở khóa: chỉ hiện I LOVE ...
      x.font=`bold ${.65*U}px ${f}`;x.fillStyle=g1;x.fillText('I LOVE ...',tw/2,l1 + 0.3*U);
    } else {
      // Khi đã mở khóa: hiện đầy đủ
      x.font=`bold ${.55*U}px ${f}`;x.fillStyle=g1;x.fillText('I LOVE YOU',tw/2,l1);
      x.font=`900 ${.95*U}px ${f}`;x.fillStyle=g2;x.fillText('MAI ANH',tw/2,l2);
    }
  }
}

function text(t){
  const a=sm((t-1.5)/1);if(a<=0)return;
  const s=1+.03*Math.sin(t*3); 
  
  const touchy=matchMedia('(pointer:coarse)').matches;
  const textOffset = touchy ? 2.6 : 3.6; 
  const ty=Math.min(OY+textOffset*U0,H-1.15*U0);
  
  let cx=OX+(W/2-OX)*ZM;
  let cy=OY+(ty-OY)*ZM;
  
  cx += Math.sin(YAW) * (U0 * 0.4); 
  cy -= Math.sin(PIT) * (U0 * 0.4);

  g.globalCompositeOperation='source-over';g.globalAlpha=a;g.save();g.translate(cx,cy);
  g.scale(s*ZM, s*ZM);
  
  g.drawImage(tc,-tw/2,-th/2,tw,th);g.restore();g.globalAlpha=1;
}

/* ---------- mạng nhện trái tim + tương tác chạm/chuột ---------- */
const touchy=matchMedia('(pointer:coarse)').matches;
let mx=-1e3,my=-1e3,sx=-1e3,sy=-1e3,hov=false,aid=null;
const NH=[],NEAR=[],MAXD=230,PD=95;let ni=0;
let MAX = touchy ? 60 : 360; 

function spawn(x,y,n){for(let i=0;i<n;i++){const a=rg(0,T2),s=rg(2,5.5),p={x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,tx:rg(-.3,.3),ty:rg(-.55,-.1),s:rg(7,14),ph:rg(0,T2),a:rg(.6,.95),c:(R()*3)|0,b:curT};
  if(NH.length<MAX)NH.push(p);else{NH[ni]=p;ni=(ni+1)%MAX}}}
let lx=0,ly=0,mv=0,d0=1,z0=1;const ptrs=new Map();
const mid=()=>{let x=0,y=0;ptrs.forEach(p=>{x+=p.x;y+=p.y});return[x/ptrs.size,y/ptrs.size]};
const dist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'){mx=e.clientX;my=e.clientY;if(!hov){sx=mx;sy=my;hov=true}}return}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size>=2){const m=mid(),dx=m[0]-lx,dy=m[1]-ly;lx=m[0];ly=m[1];mv=99;
    YAW+=dx*2.1/U0;dxs+=dx;PIT=cl(PIT+dy*.004,-1.2,1.2);ZM=cl(z0*dist()/d0,.5,3)}
  else{mx=p.x;my=p.y;if(!hov){sx=mx;sy=my;hov=true}
    const dx=mx-lx,dy=my-ly;lx=mx;ly=my;mv+=Math.abs(dx)+Math.abs(dy);YAW+=dx*2.1/U0;dxs+=dx;PIT=cl(PIT+dy*.004,-1.2,1.2)}});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'||!ptrs.size)hov=false});
cv.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===1){mx=sx=lx=e.clientX;my=sy=ly=e.clientY;hov=true;drag=true;mv=0;dxs=0;YV=0;cv.style.cursor='grabbing'}
  else if(ptrs.size===2){const m=mid();lx=m[0];ly=m[1];d0=dist();z0=ZM;mv=99;hov=false}});
const endP=(e,tap)=>{
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){drag=false;cv.style.cursor='grab';if(tap&&mv<(touchy?14:8))spawn(e.clientX,e.clientY,9);YV=cl(YV,-12,12);if(touchy)hov=false}
  else if(ptrs.size===1){const q=[...ptrs.values()][0];lx=mx=sx=q.x;ly=my=sy=q.y;mv=99;hov=true}};
cv.addEventListener('pointerup',e=>endP(e,true));
cv.addEventListener('pointercancel',e=>endP(e,false));
cv.addEventListener('wheel',e=>{e.preventDefault();ZM=cl(ZM*Math.exp(-e.deltaY*.0015),.5,3)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('gesturestart',e=>e.preventDefault());
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function web(t,k){
  g.globalCompositeOperation='lighter';g.lineCap='round';
  if(hov){sx+=(mx-sx)*Math.min(1,.3*k);sy+=(my-sy)*Math.min(1,.3*k);g.globalAlpha=.55;g.drawImage(SPG,sx-42,sy-42,84,84)}
  NEAR.length=0;const wo=cl(omega,-4,4),wa=wo*.06*U/100,wcx=OX,wcy=OY-.3*U;
  for(const p of NH){
    const qx=p.x-wcx,qy=p.y-wcy,q2=qx*qx+qy*qy,qd=Math.sqrt(q2)+1,fo=wa/(1+q2/(2.56*U*U)),fl=Math.max(0,Math.abs(wo)-1.2)*.25*fo*Math.sign(wo);
    p.vx+=((p.tx-p.vx)*.03+(qy/qd)*fo+(qx/qd)*fl)*k;p.vy+=((p.ty-p.vy)*.03-(qx/qd)*fo+(qy/qd)*fl)*k;
    p.x+=(p.vx+Math.sin(t*.9+p.ph)*.12)*k;p.y+=p.vy*k;
    if(p.x<-20)p.x=W+20;else if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;else if(p.y>H+20)p.y=-20;
    const pop=sm((t-p.b)/.45),sz=p.s*.75*pop*(1+.08*Math.sin(3*t+p.ph));
    g.globalAlpha=p.a*.7*pop;g.drawImage(HS[p.c],p.x-sz,p.y-sz,sz*2,sz*2);
    if(hov&&NEAR.length<56){const dx=sx-p.x,dy=sy-p.y,d=Math.sqrt(dx*dx+dy*dy);if(d<MAXD){p.d=d;NEAR.push(p)}}}
  if(!NEAR.length){g.globalAlpha=1;return}
  g.lineWidth=1.1;
  for(const p of NEAR){const w=1-p.d/MAXD;g.strokeStyle=`rgba(255,90,110,${.7*w})`;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(sx,sy);g.stroke()}
  g.lineWidth=.8;
  for(let i=0;i<NEAR.length;i++){const a=NEAR[i];for(let j=i+1;j<NEAR.length;j++){const b=NEAR[j],dx=a.x-b.x,dy=a.y-b.y;
    if(dx>PD||dx<-PD||dy>PD||dy<-PD)continue;const d=Math.sqrt(dx*dx+dy*dy);
    if(d<PD){g.strokeStyle=`rgba(255,90,110,${.4*(1-d/PD)*(1-a.d/MAXD)})`;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}}
  g.globalAlpha=1}

/* ---------- khung hình ---------- */
function draw(t,f,k){
  // KIỂM TRA ĐỂ BẬT BẢNG THÔNG BÁO SAU 1.5 GIÂY
  if(t > 1.5 && !modalShown) {
      modalShown = true;
      document.getElementById('pwdModal').style.display = 'flex';
  }

  curT=t;U=U0*ZM;setView();g.setTransform(dpr,0,0,dpr,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.drawImage(bgc,0,0,W,H);
  const bk=sm((t-1.55)/.5),ra=sm((t-1.85)/.4);
  if(Q<2)bokeh(t);
  web(t,k);streakUpd(t);streaks(false);hearts(t,false);
  if(ra)rings.forEach(o=>{ringPrep(o,t,.8+.2*ra);ring(o,false,ra)});
  if(bk){const fast=drag||Math.abs(YV)>.3,cad=[1,2,3][Q];if(f%cad===0||fast||bqT<0||bqZ!==ZM){bouquet(bq,t,bk,bqT<0||f%(cad*2)===0||(fast&&(f&1)===0));bqT=t;bqZ=ZM}
    g.globalCompositeOperation='source-over';g.globalAlpha=1;g.drawImage(bc,bx,by,bw,bh)}
  if(ra)rings.forEach(o=>ring(o,true,ra));
  streaks(true);hearts(t,true);text(t);
  g.globalCompositeOperation='source-over';g.globalAlpha=1}

/* ---------- vòng lặp & khởi tạo ---------- */
const qp=new URLSearchParams(location.search),fixed=qp.has('t')?+qp.get('t'):null;
const still=fixed!==null,t0=performance.now();
const now=()=>fixed!==null?fixed:(performance.now()-t0)/1e3;
function size(){
  const vv=window.visualViewport,w=Math.round(vv?vv.width:innerWidth),h=Math.round(vv?vv.height:innerHeight);
  if(w===W&&h===H&&cv.width)return;
  dpr=Math.min(devicePixelRatio||1,[2,1.5,1][Q]);W=w;H=h;cv.width=W*dpr|0;cv.height=H*dpr|0;
  U0=100*Math.min(W/540,H/480);U=U0*ZM;OX=W/2+.16*U0;OY=H/2;
  bx=0;by=0;bw=W;bh=H;bc.width=bw*dpr|0;bc.height=bh*dpr|0;bq=bc.getContext('2d');bqT=-1;
  buildText();
  
  if(!NH.length){
    let initCount = touchy ? 20 : 90; 
    for(let i=0;i<initCount;i++)NH.push({x:rg(0,W),y:rg(0,H),vx:rg(-.3,.3),vy:rg(-.4,-.05),tx:rg(-.3,.3),ty:rg(-.5,-.08),s:rg(5,10),ph:rg(0,T2),a:rg(.4,.8),c:(R()*3)|0,b:-9});
  }
  
  if(still)draw(now(),0,0)}
let rt;const onRs=()=>{clearTimeout(rt);rt=setTimeout(size,120)};
addEventListener('resize',onRs);addEventListener('orientationchange',()=>{clearTimeout(rt);rt=setTimeout(size,300)});
if(window.visualViewport)visualViewport.addEventListener('resize',onRs);
size();
window.__draw=t=>draw(t,0,0);
let last=performance.now(),f=0,lf=0,ema=16;
(function loop(n){if(still)return;
  const dt=Math.min(.05,(n-last)/1e3);last=n;f++;ema=ema*.95+dt*1e3*.05;
  /* tự hạ chất lượng nếu máy yếu */
  if(f-lf>90&&ema>24&&Q<2){Q++;lf=f;W=0;size();ema=16}
  if(drag){YV+=((dxs*2.1/U/Math.max(dt,.001))-YV)*.4;YV=cl(YV,-12,12);dxs=0;omega=YV}
  else{YV*=Math.exp(-1.1*dt);YAW+=YV*dt;PIT*=Math.exp(-1.6*dt);omega=.42+YV}
  draw(now(),f,dt*60);requestAnimationFrame(loop)})(last);
})();
</script>
